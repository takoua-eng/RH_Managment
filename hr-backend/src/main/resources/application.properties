spring.application.name=hr-backend
server.port=${SERVER_PORT:8087}

# ===============================
# PostgreSQL
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hr_management}
spring.datasource.username=${DB_USERNAME:hr_uuser}
spring.datasource.password=${DB_PASSWORD:hr123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

# ===============================
# Keycloak / JWT
# ===============================
keycloak.auth-server-url=${KEYCLOAK_URL:http://localhost:9090}
keycloak.realm=${KEYCLOAK_REALM:hr-realm}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:hr-angular}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.auth-server-url}/realms/${keycloak.realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${keycloak.auth-server-url}/realms/${keycloak.realm}/protocol/openid-connect/certs

# ===============================
# Fichiers (CV, lettres, photos)
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload-dir=${UPLOAD_DIR:C:/Users/Lenovo/Desktop/stage 4/stage/uploads}
app.migration.enabled=false

# ===============================
# Mail (Gmail) : le mot de passe vient de la variable MAIL_PASSWORD
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:naceurtakoua@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:naceurtakoua@gmail.com}

# ===============================
# Microservice IA
# ===============================
ai.service.url=${AI_SERVICE_URL:http://localhost:8089}
ai.service.api-key=${AI_API_KEY:une-longue-cle-secrete}

# ===============================
# Adresses autorisees (WebSocket, CORS) et proxy
# ===============================
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
server.forward-headers-strategy=framework
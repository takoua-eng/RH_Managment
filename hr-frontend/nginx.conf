server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression des fichiers texte
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Application Angular (SPA) : toute route inconnue renvoie index.html,
    # le routeur Angular prend ensuite le relais (ex. /dashboard/leave)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html ne doit jamais être mis en cache : il référence les fichiers de la dernière version
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Les fichiers JS/CSS ont un nom unique à chaque build (hash) : cache long sans risque
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
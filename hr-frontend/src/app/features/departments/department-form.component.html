<div class="department-form-page">
  <div class="row mb-4">
    <div class="col-12">
      <h2 class="fw-bold mb-1">{{ isEditMode ? 'Modifier le département' : 'Nouveau département' }}</h2>
      <p class="text-muted mb-0">Renseignez les informations du département.</p>
    </div>
  </div>

  <div *ngIf="loading" class="text-center py-5 text-muted">Chargement...</div>

  <div class="fluent-card" *ngIf="!loading" style="max-width: 600px;">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label fw-semibold">Nom du département</label>
        <input formControlName="name" type="text" class="form-control fluent-input" placeholder="ex: IT, RH, Marketing..." />
        <span *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="text-danger fs-8">
          Le nom est obligatoire
        </span>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Description</label>
        <textarea formControlName="description" class="form-control fluent-input" rows="3"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Chef de département</label>
        <select formControlName="managerId" class="form-select fluent-input">
          <option [ngValue]="null">-- Aucun --</option>
          <option *ngFor="let emp of employees" [ngValue]="emp.id">
            {{ emp.firstName }} {{ emp.lastName }}
          </option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Localisation</label>
        <select formControlName="location" class="form-select fluent-input">
          <option value="">-- Sélectionner --</option>
          <option *ngFor="let gov of governorates" [value]="gov">{{ gov }}</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Budget Annuel (TND)</label>
        <input formControlName="budget" type="number" class="form-control fluent-input" placeholder="ex: 150000" />
      </div>

      <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

      <div class="d-flex gap-2 justify-content-end">
        <button type="button" class="fluent-btn" (click)="onCancel()">Annuler</button>
        <button type="submit" class="fluent-btn primary" [disabled]="form.invalid || saving">
          {{ saving ? 'Enregistrement...' : 'Enregistrer' }}
        </button>
      </div>
    </form>
  </div>
</div>
